name: AI service

on:
  push:
    paths:
      - "ai-service/**"
      - ".python-version"
      - ".github/workflows/ai-service.yml"
  pull_request:
    paths:
      - "ai-service/**"
      - ".python-version"
      - ".github/workflows/ai-service.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: python -m pip install -r ai-service/requirements.txt
      - run: python -m pip install -r ai-service/requirements-dev.txt
      - run: python -m pytest ai-service
      - run: python -m ruff check ai-service
      - run: python -m mypy
        working-directory: ai-service
