[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = [
  "app",
  "aggregate_evaluations.py",
  "dataset_manifest.py",
  "evaluate_pipeline.py",
  "persian_text.py",
  "settings.py",
]
